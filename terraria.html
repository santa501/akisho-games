<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERRARIA プレイ日記 — AKISHO GAMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E4E4DA;
    --paper-2:#DAD9CD;
    --ink:#1C1B19;
    --pink:#FF3D82;
    --teal:#007A8A;
    --purple:#5B3E96;
    --line: rgba(28,27,25,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(28,27,25,0.07) 1px, transparent 0);
    background-size: 14px 14px;
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .display{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900; }
  a{ color:inherit; }
  ::selection{ background:var(--pink); color:var(--paper); }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  .misprint{ position:relative; display:inline-block; color:var(--ink); }
  .misprint::before,.misprint::after{
    content: attr(data-text); position:absolute; left:0; top:0; width:100%;
    mix-blend-mode:multiply; z-index:-1;
  }
  .misprint::before{ color:var(--pink); transform:translate(3px,2px); }
  .misprint::after{ color:var(--teal); transform:translate(-3px,-2px); }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 24px;
    background:var(--paper);
    border-bottom:2px solid var(--ink);
    position:sticky; top:0; z-index:50;
  }
  .topbar .brand{ font-size:14px; letter-spacing:.08em; }
  .topbar a.back{ font-size:12px; letter-spacing:.05em; text-decoration:none; border-bottom:1px solid var(--ink); }

  .masthead{ padding:52px 24px 20px; text-align:center; }
  .issue-tag{
    display:inline-block; font-size:12px; letter-spacing:.12em;
    padding:4px 10px; border:1px solid var(--ink); margin-bottom:18px;
    transform:rotate(-2deg); background:var(--paper);
  }
  .masthead h1{ font-size:clamp(40px, 9vw, 84px); line-height:.95; margin:0; }
  .masthead .sub-jp{
    display:block; font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700;
    font-size:clamp(16px, 2.6vw, 22px); margin-top:8px;
  }

  section{ padding:40px 24px; max-width:820px; margin:0 auto; }
  .section-head{
    display:flex; align-items:baseline; gap:14px; margin-bottom:24px;
    border-bottom:2px solid var(--ink); padding-bottom:10px;
  }
  .section-head .no{ font-size:12px; }
  .section-head h2{ font-size:24px; margin:0; }

  .intro{
    display:grid; grid-template-columns: 1fr 1.2fr; gap:28px; align-items:center;
    border:2px solid var(--ink); background:var(--paper-2); padding:26px;
  }
  .intro-cover{
    aspect-ratio:4/3;
    background:
      radial-gradient(circle at 30% 30%, var(--teal) 0, transparent 55%),
      radial-gradient(circle at 70% 65%, var(--pink) 0, transparent 55%),
      var(--ink);
    position:relative; overflow:hidden;
  }
  .intro-cover::after{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(rgba(228,228,218,.9) 1px, transparent 1.4px);
    background-size:6px 6px; mix-blend-mode:screen; opacity:.5;
  }
  .intro-body .eyebrow{ font-size:12px; letter-spacing:.1em; color:var(--purple); }
  .intro-body h3{ font-size:26px; margin:8px 0 10px; }
  .intro-body p{ font-size:14px; line-height:1.9; color:rgba(28,27,25,.85); }
  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .tag{ font-size:11px; letter-spacing:.05em; padding:4px 9px; border:1px solid var(--ink); background:var(--paper); }

  /* ---------- diary ---------- */
  .diary-open-btn{
    display:block; width:100%;
    font-family:'JetBrains Mono', monospace; font-size:14px; letter-spacing:.04em;
    padding:16px; margin-top:8px;
    background:var(--ink); color:var(--paper);
    border:2px solid var(--ink); cursor:pointer;
    transition: transform .12s ease;
  }
  .diary-open-btn:hover{ transform:translateY(-2px); }
  .diary-open-btn:focus-visible{ outline:2px solid var(--pink); outline-offset:3px; }

  .diary-form{
    display:none;
    border:2px solid var(--ink); border-top:none;
    background:var(--paper-2);
    padding:20px;
  }
  .diary-form.open{ display:block; }
  .diary-form label{
    display:block; font-size:11px; letter-spacing:.06em; margin-bottom:6px;
  }
  .diary-form input[type="text"]{
    width:100%; font-family:'Noto Sans JP', sans-serif; font-size:14px;
    padding:10px; border:1px solid var(--ink); background:var(--paper);
    margin-bottom:14px;
  }
  .diary-form textarea{
    width:100%; min-height:120px; font-family:'Noto Sans JP', sans-serif; font-size:14px;
    line-height:1.8; padding:12px; border:1px solid var(--ink); background:var(--paper);
    resize:vertical; margin-bottom:14px;
  }
  .diary-form input:focus-visible, .diary-form textarea:focus-visible{
    outline:2px solid var(--purple); outline-offset:1px;
  }
  .diary-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .btn{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.04em;
    padding:9px 18px; border:1px solid var(--ink); background:var(--paper); cursor:pointer;
  }
  .btn.primary{ background:var(--ink); color:var(--paper); }
  .btn:focus-visible{ outline:2px solid var(--purple); outline-offset:2px; }

  .entries{ margin-top:32px; }
  .entries-empty{
    font-size:13px; color:rgba(28,27,25,.6); text-align:center; padding:24px 0;
  }
  .entry{
    border:2px solid var(--ink); background:var(--paper-2);
    padding:18px 20px; margin-bottom:16px;
    position:relative;
  }
  .entry:nth-child(odd){ transform:rotate(-.4deg); }
  .entry:nth-child(even){ transform:rotate(.4deg); }
  .entry-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    margin-bottom:8px; flex-wrap:wrap;
  }
  .entry-title{ font-size:16px; font-weight:700; margin:0; }
  .entry-date{ font-size:11px; color:var(--purple); }
  .entry-body{ font-size:13px; line-height:1.85; white-space:pre-wrap; color:rgba(28,27,25,.88); }
  .entry-delete{
    margin-top:10px; font-size:11px; background:none; border:none; color:rgba(28,27,25,.5);
    cursor:pointer; padding:0; text-decoration:underline;
  }

  footer{ border-top:2px solid var(--ink); padding:30px 24px 40px; text-align:center; }
  footer .colophon{ font-size:12px; letter-spacing:.05em; line-height:2; color:rgba(28,27,25,.75); }

  @media (max-width:640px){
    .intro{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand mono">AKISHO GAMES <span style="opacity:.5">/ 特別編</span></div>
  <span class="mono" style="font-size:11px; opacity:.6;">PLAY DIARY</span>
</div>

<header class="masthead">
  <span class="issue-tag mono">SPECIAL FEATURE</span>
  <h1>
    <span class="misprint display" data-text="TERRARIA">TERRARIA</span>
  </h1>
  <span class="sub-jp">プレイ日記</span>
</header>

<section id="intro">
  <div class="section-head">
    <span class="no mono">01</span>
    <h2>この作品について</h2>
  </div>
  <div class="intro">
    <div class="intro-cover"></div>
    <div class="intro-body">
      <div class="eyebrow mono">ACTION・サンドボックス</div>
      <h3>Terraria（テラリア）</h3>
      <p>地下を掘り進めて資源を集め、拠点を作り、モンスターと戦う2Dサンドボックスアクション。やることは山ほどあるのに強制されないので、自分のペースで目標を見つけながら長く遊べます。</p>
      <div class="tag-row">
        <span class="tag mono">1人用/マルチ対応</span>
        <span class="tag mono">やり込み要素多数</span>
        <span class="tag mono">クラフト・探索</span>
      </div>
    </div>
  </div>
</section>

<section id="diary">
  <div class="section-head">
    <span class="no mono">02</span>
    <h2>プレイ日記</h2>
  </div>

  <button class="diary-open-btn mono" id="openDiaryBtn" aria-expanded="false" aria-controls="diaryForm">
    ＋ 感想を書く
  </button>

  <form class="diary-form" id="diaryForm">
    <label class="mono" for="entryTitle">見出し（任意）</label>
    <input type="text" id="entryTitle" placeholder="例：初日、洞窟に潜って死にかけた話">
    <label class="mono" for="entryBody">感想・プレイ日記</label>
    <textarea id="entryBody" placeholder="今日プレイして感じたこと、進んだところ、ハマったポイントなど自由に書いてください"></textarea>
    <div class="diary-actions">
      <button type="button" class="btn" id="cancelBtn">キャンセル</button>
      <button type="submit" class="btn primary">保存する</button>
    </div>
  </form>

  <div class="entries" id="entriesList">
    <p class="entries-empty mono" id="loadingMsg">読み込み中…</p>
  </div>
</section>

<footer>
  <p class="colophon mono">
    AKISHO GAMES — TERRARIA プレイ日記（特別編）<br>
    書いた感想はこのブラウザに保存されます
  </p>
</footer>

<script>
  const STORAGE_KEY = 'terraria-diary-entries';

  const openBtn = document.getElementById('openDiaryBtn');
  const form = document.getElementById('diaryForm');
  const cancelBtn = document.getElementById('cancelBtn');
  const titleInput = document.getElementById('entryTitle');
  const bodyInput = document.getElementById('entryBody');
  const entriesList = document.getElementById('entriesList');

  function closeForm(){
    form.classList.remove('open');
    openBtn.setAttribute('aria-expanded', 'false');
    openBtn.textContent = '＋ 感想を書く';
  }

  openBtn.addEventListener('click', () => {
    const isOpen = form.classList.toggle('open');
    openBtn.setAttribute('aria-expanded', String(isOpen));
    openBtn.textContent = isOpen ? '－ 閉じる' : '＋ 感想を書く';
    if(isOpen){ bodyInput.focus(); }
  });

  cancelBtn.addEventListener('click', () => {
    titleInput.value = '';
    bodyInput.value = '';
    closeForm();
  });

  async function loadEntries(){
    let entries = [];
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        entries = JSON.parse(raw);
      }
    }catch(err){
      entries = [];
    }
    renderEntries(entries);
    return entries;
  }

  async function saveEntries(entries){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }catch(err){
      console.error('保存に失敗しました', err);
    }
  }

  function formatDate(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }

  function renderEntries(entries){
    entriesList.innerHTML = '';
    if(!entries.length){
      const p = document.createElement('p');
      p.className = 'entries-empty mono';
      p.textContent = 'まだ日記がありません。「＋ 感想を書く」から最初の1本を。';
      entriesList.appendChild(p);
      return;
    }
    entries.slice().reverse().forEach((entry) => {
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `
        <div class="entry-head">
          <p class="entry-title">${escapeHtml(entry.title || '無題')}</p>
          <span class="entry-date mono">${formatDate(entry.date)}</span>
        </div>
        <div class="entry-body">${escapeHtml(entry.body)}</div>
        <button class="entry-delete mono" data-id="${entry.id}">削除</button>
      `;
      entriesList.appendChild(div);
    });

    entriesList.querySelectorAll('.entry-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        let entries = await loadEntries();
        entries = entries.filter(e => String(e.id) !== String(id));
        await saveEntries(entries);
        renderEntries(entries);
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = bodyInput.value.trim();
    if(!body) { bodyInput.focus(); return; }

    let entries = await loadEntries();
    entries.push({
      id: Date.now(),
      title: titleInput.value.trim(),
      body: body,
      date: new Date().toISOString()
    });
    await saveEntries(entries);
    renderEntries(entries);

    titleInput.value = '';
    bodyInput.value = '';
    closeForm();
  });

  loadEntries();
</script>

</body>
</html>
